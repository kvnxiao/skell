name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The Windows image lacks zsh and fish; tests/run-all.sh skips those suites.
  # The PowerShell suites cover Windows store behavior.
  shells:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install shells and gawk on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gawk zsh fish shellcheck

      - name: Install shells and gawk on macOS
        if: runner.os == 'macOS'
        run: brew install bash gawk zsh fish shellcheck

      - name: Install gawk on Windows
        if: runner.os == 'Windows'
        run: choco install gawk --no-progress -y

      # An `&&` chain would fail when an optional shell is missing. Use an `if`
      # for each shell check.
      - name: Check syntax
        run: |
          set -e
          bash -n bash/*.bash share/*.sh tests/*.sh tests/lib/*.sh
          for script in share/*.awk; do gawk -f "$script" </dev/null >/dev/null; done
          if command -v zsh >/dev/null; then
            zsh -n zsh/*.zsh tests/lib/*.zsh
          fi
          if command -v fish >/dev/null; then
            fish -n fish/conf.d/*.fish fish/functions/*.fish tests/lib/*.fish
            fish_indent --check fish/conf.d/*.fish fish/functions/*.fish tests/lib/*.fish
          fi

      - name: Lint shell scripts
        if: runner.os != 'Windows'
        run: shellcheck --severity=style bash/*.bash share/*.sh tests/*.sh tests/lib/*.sh

      - name: Run the suites
        run: bash tests/run-all.sh

  analyzer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          $findings = @(Invoke-ScriptAnalyzer -Path powershell -Recurse `
              -Settings PSScriptAnalyzerSettings.psd1 -Severity Error,Warning,Information)
          $findings | Format-Table -Wrap
          if (@($findings | Where-Object Severity -In 'Error', 'Warning').Count) { exit 1 }

  minimum-powershell:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/powershell:7.4-ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Run PowerShell suites on the minimum version
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion -lt [version]'7.4' -or
              $PSVersionTable.PSVersion -ge [version]'7.5') { exit 1 }
          $sandbox = Join-Path ([System.IO.Path]::GetTempPath()) "skell-pwsh-$PID"
          try {
            $null = New-Item -ItemType Directory -Path $sandbox -Force
            $env:SKELL_DATA_DIR = Join-Path $sandbox data
            $env:SKELL_HISTORY = Join-Path $sandbox history.tsv
            ./tests/codec-pwsh.ps1 -VectorsTsv ./tests/lib/vectors.tsv `
              -ModulePath ./powershell/Skell.psm1
            ./tests/lifecycle-pwsh.ps1 -ModulePath ./powershell/Skell.psm1 `
              -Sandbox $sandbox
          } finally {
            Remove-Item -LiteralPath $sandbox -Recurse -Force -ErrorAction Ignore
          }
